<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Claude Session Screen</title>
  <link rel="stylesheet" href="../libs/css/uspi.css">
  <link rel="stylesheet" href="./pi.css">
</head>
<body>
  <div class="udpi-wrapper hidden uspi-wrapper">
    <form id="property-inspector" onsubmit="return false">
      <div class="panel">
        <label for="mode" data-localize="cycle_label">Cycle between</label>
        <select id="mode">
          <option value="windows" data-localize="cycle_windows">Windows (cmd+`)</option>
          <option value="tabs" data-localize="cycle_tabs">Tabs (cmd+shift+])</option>
        </select>
        <label for="terminal" data-localize="terminal_label">Terminal</label>
        <select id="terminal"></select>
        <div class="muted" data-localize="terminal_help_cycle">Global choice — used by all Claude Deck keys (session display, jump, answering).</div>
        <div class="actions" style="margin-top:12px">
          <button type="button" id="guide-open" class="pi-button ghost" data-localize="btn_guide">User Guide</button>
        </div>
        <div class="legend" data-localize="grey_legend">Black-and-white keys mean no Claude Code session is being tracked. The keys return to colour as soon as a session is detected.</div>
      </div>
    </form>
  </div>

  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
  <script>window.PI_FIELDS = [{"id": "mode", "default": "windows"}];</script>
  <script src="./pi-common.js"></script>
  <script src="./pi-terminal.js"></script>
  <script src="./pi-setup.js"></script>
</body>
</html>
